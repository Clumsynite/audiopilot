name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # scan the full history
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-test:
    # Xcode 27 image (macOS 26 SDK APIs such as Liquid Glass). Switch to macos-26 if you prefer the GA image.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # build number = commit count

      - name: Toolchain
        run: swift --version && xcodebuild -version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Build app bundle
        run: scripts/build-app.sh

      - name: Check bundle and release metadata
        run: |
          PLIST=build/AudioPilot.app/Contents/Info.plist
          # Every permission AudioPilot asks for needs its usage string, or macOS denies it silently.
          for key in NSMicrophoneUsageDescription NSAudioCaptureUsageDescription NSBluetoothAlwaysUsageDescription \
                     NSLocationWhenInUseUsageDescription; do
            plutil -extract "$key" raw "$PLIST" >/dev/null || { echo "::error::Info.plist is missing $key"; exit 1; }
          done
          VERSION="$(plutil -extract CFBundleShortVersionString raw Resources/Info.plist)"
          grep -q "badge/version-$VERSION-blue" README.md \
            || { echo "::error::README version badge doesn't show $VERSION (use scripts/bump-version.sh)"; exit 1; }
          grep -qE "^## (Unreleased|$VERSION)( |\$)" CHANGELOG.md \
            || { echo "::error::CHANGELOG.md needs an '## Unreleased' or '## $VERSION' section"; exit 1; }

      - name: Smoke test
        # Read-only diagnostics: no audio changes, no UI.
        run: |
          build/AudioPilot.app/Contents/MacOS/AudioPilot --list-devices
          build/AudioPilot.app/Contents/MacOS/AudioPilot --app-audio

      - name: Package
        run: scripts/package.sh

      - name: Build site
        run: SITE_URL=https://audiopilot.example.invalid scripts/build-site.sh

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: AudioPilot-${{ github.sha }}
          path: dist/*
          retention-days: 14
